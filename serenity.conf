serenity {
    take.screenshots = AFTER_EACH_STEP
    console.colors = true
}

environments {
    default {
        webdriver.driver = appium
        appium {
            hub = "http://127.0.0.1:4723"
            platformName = "Android"
            automationName = "UiAutomator2"
            deviceName = "Android Emulator"
            app = "${user.dir}/src/test/resources/apps/your_application.apk"
            fullReset = false
            noReset = true
        }
    }

    ios {
        webdriver.driver = appium
        appium {
            hub = "http://127.0.0.1:4723"
            platformName = "iOS"
            automationName = "XCUITest"
            deviceName = "iPhone Simulator"
            app = "${user.dir}/src/test/resources/apps/your_application.app"
        }
    }
}
